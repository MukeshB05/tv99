<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dreamly5 LIVE TV</title>
<meta name="theme-color" content="#0f1020">
<style>
:root{--bg:#0f1020;--card:#1a1b2e;--card2:#23253d;--text:#f2f3f8;--muted:#9a9db5;--accent:#e01e26;--border:#2c2f4d}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.player{position:sticky;top:0;z-index:10;background:#000;aspect-ratio:16/9;width:100%;max-height:60vh;overflow:hidden}
.player video{width:100%;height:100%;object-fit:contain;background:#000}
.overlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(0,0,0,.55);text-align:center;padding:16px}
.overlay.show{display:flex}
.spinner{width:56px;height:56px;border:4px solid rgba(224,30,38,.25);border-top-color:var(--accent);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.overlay .msg{color:var(--accent);font-size:1.2rem;font-weight:600}
.overlay.error .msg{color:#fff;font-size:1rem}
.retry{background:var(--accent);color:#fff;border:0;border-radius:20px;padding:8px 20px;font-size:.95rem;cursor:pointer}
.poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.controls{display:flex;gap:8px;padding:10px 16px;background:var(--card)}
.controls select{flex:1;background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px;font-size:.9rem}
main{padding:20px 16px 40px;background:var(--card);border-radius:24px 24px 0 0;margin-top:0}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:8px 0 18px}
.head h1{font-size:1.4rem;font-weight:600}
.head p{color:var(--muted);margin-top:6px}
.head img{height:48px;max-width:40%;object-fit:contain}
.search{width:100%;background:var(--bg);color:var(--text);border:1.5px solid var(--text);border-radius:14px;padding:14px 16px;font-size:1rem;margin-bottom:16px}
.search:focus,.chip:focus-visible,.ch:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--card2);color:var(--muted);border:1.5px solid var(--border);border-radius:999px;padding:12px 22px;font-size:1rem;cursor:pointer;white-space:nowrap}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.ch{background:var(--card2);border:2px solid transparent;border-radius:20px;padding:10px 8px 14px;text-align:center;cursor:pointer;color:var(--text);font:inherit}
.ch.active{border-color:var(--accent)}
.logo{background:#fff;border-radius:16px;aspect-ratio:1.1;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:10px}
.logo img{max-width:80%;max-height:80%;object-fit:contain}
.ch span{display:block;font-size:.95rem;line-height:1.25;overflow-wrap:anywhere}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:30px 0}
@media(min-width:700px){.grid{grid-template-columns:repeat(5,1fr)}main{max-width:1100px;margin:0 auto}}
@media(prefers-reduced-motion:reduce){.spinner{animation-duration:3s}}
</style>
</head>
<body>

<section class="player" id="player">
  <img class="poster" id="poster" src="image/Dreamly5cover.jpg" alt="Dreamly5 LIVE TV poster">
  <video id="video" playsinline controls></video>
  <div class="overlay" id="loading"><div class="spinner"></div><div class="msg">Loading...</div></div>
  <div class="overlay error" id="error">
    <div class="msg" id="errorMsg">Channel failed to load. Please try another channel.</div>
    <button class="retry" id="retry" type="button">Retry</button>
  </div>
</section>

<div class="controls">
  <select id="source" aria-label="Source" hidden></select>
  <select id="quality" aria-label="Quality"><option value="-1">Quality: Auto</option></select>
</div>

<main>
  <div class="head">
    <div><h1>Dreamly5 LIVE TV</h1><p id="count">Loading channels...</p></div>
    <img src="https://i.ibb.co/TB2wVJ5r/Dreamly5livetv.png" alt="Dreamly5 LIVE TV logo">
  </div>
  <input class="search" id="search" type="search" placeholder="Search channels..." aria-label="Search channels" autocomplete="off">
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
/* ===== CONFIG ===== */
const CHANNELS_URL = 'channels.json';   // put your channel list next to index.html
const LOAD_TIMEOUT = 15000;             // ms before a stream is marked as failed

/* ===== STATE ===== */
const $ = id => document.getElementById(id);
const video = $('video'), loading = $('loading'), errorBox = $('error');
let channels = [], current = null, hls = null, timer = null, group = 'All', query = '';

/* ===== HELPERS ===== */
// Accepts different field names so your existing JSON keeps working
function normalize(c, i) {
  const urls = [].concat(c.urls || c.sources || c.url || c.stream || c.link || c.src || []).filter(Boolean);
  return {
    id: i,
    name: String(c.name || c.title || 'Channel ' + (i + 1)).trim(),
    logo: c.logo || c.image || c.icon || '',
    group: c.group || c.category || c['group-title'] || 'Other',
    urls: urls.map(u => String(u).replace(/^http:\/\//i, 'https://'))   // avoid mixed-content blocking
  };
}
function setState(state, msg) {            // 'loading' | 'error' | 'playing'
  loading.classList.toggle('show', state === 'loading');
  errorBox.classList.toggle('show', state === 'error');
  $('poster').style.display = state === 'playing' ? 'none' : 'block';
  if (msg) $('errorMsg').textContent = msg;
}
function stop() {
  clearTimeout(timer);
  if (hls) { hls.destroy(); hls = null; }
  video.removeAttribute('src'); video.load();
}

/* ===== PLAYER ===== */
function play(channel, srcIndex = 0) {
  stop();
  current = { channel, srcIndex };
  const url = channel.urls[srcIndex];
  highlight();
  buildSources(channel, srcIndex);
  resetQuality();

  if (!url) return setState('error', 'No stream available for this channel.');
  setState('loading');

  timer = setTimeout(() => fail('Channel is taking too long to load. Please try another channel.'), LOAD_TIMEOUT);
  video.addEventListener('playing', () => { clearTimeout(timer); setState('playing'); }, { once: true });

  const isHls = /\.m3u8(\?|$)/i.test(url) || !/\.(mp4|webm|mkv)(\?|$)/i.test(url);
  if (isHls && window.Hls && Hls.isSupported()) {
    hls = new Hls({ manifestLoadingMaxRetry: 2, levelLoadingMaxRetry: 2, fragLoadingMaxRetry: 3, lowLatencyMode: false });
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, (_, d) => {
      fillQuality(d.levels);
      video.play().catch(() => {});        // autoplay may be blocked; user can press play
    });
    hls.on(Hls.Events.ERROR, (_, d) => {
      if (!d.fatal) return;
      if (d.type === Hls.ErrorTypes.MEDIA_ERROR) { hls.recoverMediaError(); return; }
      fail('Channel failed to load. Please try another channel.');
    });
  } else {
    video.src = url;                       // Safari native HLS / direct files
    video.play().catch(() => {});
    video.onerror = () => fail('Channel failed to load. Please try another channel.');
  }
}
function fail(msg) {
  clearTimeout(timer);
  if (hls) { hls.destroy(); hls = null; }
  setState('error', msg);
}

/* ===== QUALITY / SOURCE ===== */
function resetQuality() { $('quality').innerHTML = '<option value="-1">Quality: Auto</option>'; }
function fillQuality(levels) {
  const q = $('quality'); resetQuality();
  levels.forEach((l, i) => {
    const o = document.createElement('option');
    o.value = i; o.textContent = l.height ? l.height + 'p' : Math.round(l.bitrate / 1000) + ' kbps';
    q.appendChild(o);
  });
}
function buildSources(channel, active) {
  const s = $('source');
  s.hidden = channel.urls.length < 2;
  s.innerHTML = '';
  channel.urls.forEach((_, i) => {
    const o = document.createElement('option');
    o.value = i; o.textContent = 'Source ' + (i + 1); o.selected = i === active;
    s.appendChild(o);
  });
}
$('quality').addEventListener('change', e => { if (hls) hls.currentLevel = Number(e.target.value); });
$('source').addEventListener('change', e => current && play(current.channel, Number(e.target.value)));
$('retry').addEventListener('click', () => current && play(current.channel, current.srcIndex));

/* ===== UI ===== */
function visible() {
  const q = query.toLowerCase();
  return channels.filter(c => (group === 'All' || c.group === group) && c.name.toLowerCase().includes(q));
}
function render() {
  const list = visible();
  $('count').textContent = list.length === channels.length
    ? channels.length + ' channels' : list.length + ' of ' + channels.length + ' channels';
  const grid = $('grid'); grid.innerHTML = '';
  if (!list.length) { grid.innerHTML = '<div class="empty">No channels found.</div>'; return; }
  const frag = document.createDocumentFragment();
  list.forEach(c => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'ch'; b.dataset.id = c.id;
    const logo = document.createElement('div'); logo.className = 'logo';
    if (c.logo) {
      const img = document.createElement('img');
      img.src = c.logo; img.alt = ''; img.loading = 'lazy';
      img.onerror = () => img.remove();
      logo.appendChild(img);
    }
    const name = document.createElement('span'); name.textContent = c.name;   // textContent: no HTML injection
    b.append(logo, name);
    b.addEventListener('click', () => { play(c); window.scrollTo({ top: 0, behavior: 'smooth' }); });
    frag.appendChild(b);
  });
  grid.appendChild(frag);
  highlight();
}
function highlight() {
  document.querySelectorAll('.ch').forEach(el =>
    el.classList.toggle('active', current && Number(el.dataset.id) === current.channel.id));
}
function renderChips() {
  const groups = ['All', ...new Set(channels.map(c => c.group))];
  const box = $('chips'); box.innerHTML = '';
  groups.forEach(g => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip' + (g === group ? ' active' : ''); b.textContent = g;
    b.addEventListener('click', () => { group = g; renderChips(); render(); });
    box.appendChild(b);
  });
}
let debounce;
$('search').addEventListener('input', e => {
  clearTimeout(debounce);
  debounce = setTimeout(() => { query = e.target.value.trim(); render(); }, 150);
});

/* ===== INIT ===== */
(async function init() {
  try {
    const res = await fetch(CHANNELS_URL, { cache: 'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const raw = Array.isArray(data) ? data : (data.channels || []);
    channels = raw.map(normalize);
    renderChips();
    render();
  } catch (err) {
    console.error(err);
    $('count').textContent = 'Could not load channel list.';
    $('grid').innerHTML = '<div class="empty">Could not load channels.json. Check the file exists next to index.html.</div>';
  }
})();
</script>
</body>
</html>
